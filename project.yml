name: DaysCounter

options:
  bundleIdPrefix: io.damao
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

packages:
  DaysCounterKit:
    path: Packages/DaysCounterKit

settings:
  base:
    DEVELOPMENT_TEAM: T7976FL2LP
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    # macOS only; ignored when building for iOS.
    ENABLE_APP_SANDBOX: YES
    ENABLE_RESOURCE_ACCESS_CALENDARS: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:
  DaysCounter:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
    dependencies:
      - package: DaysCounterKit
      - target: DaysCounterWidget
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: DaysCounter
        CFBundleURLTypes:
          - CFBundleURLName: io.damao.DaysCounter
            CFBundleURLSchemes: [dayscounter]
        NSCalendarsFullAccessUsageDescription: DaysCounter 读取日历中的全天日程，用来计算倒数和已过去的天数，不会修改任何内容。
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/DaysCounter.entitlements
      properties:
        com.apple.security.application-groups: [group.io.damao.DaysCounter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.damao.DaysCounter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme: {}

  DaysCounterWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Widget
    dependencies:
      - package: DaysCounterKit
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: DaysCounter
        NSCalendarsFullAccessUsageDescription: DaysCounter 读取日历中的全天日程，用来计算倒数和已过去的天数，不会修改任何内容。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/DaysCounterWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.damao.DaysCounter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.damao.DaysCounter.Widget
        SKIP_INSTALL: YES
